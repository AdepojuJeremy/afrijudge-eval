# DRAFT v2 protocol. Validate format and review data before a new paid pilot.
schema_version: 1
project: AfriJudge-Eval
seed: 42
languages: [en, ha, yo, ig]
budget_limit_usd: 45.0
concurrency: 1
generation_max_tokens: 768
judge_max_tokens: 512
timeout_seconds: 600
samples:
  mmlu: 20
  mgsm: 20
  traps_per_language: 20

23" fill="#b95337"/><rect x="557" y="343" width="248" height="23" fill="#c3cbd4"/><text x="820" y="360" font-weight="bold">38/90</text><text x="26" y="414" >Anchor Top-3: stable agreement 94.4%</text><text x="26" y="441" >Anchor Bottom-3: stable agreement 53.0%</text><text x="26" y="483" font-size="13" fill="#526477">All 20 three-judge combinations per language require the archived item-level votes.</text><text x="26" y="515" font-size="12" fill="#526477">Source: Study 1 reported aggregates; reconstructed, not raw-data replay.</text></g></svg>
